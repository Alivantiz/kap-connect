<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover нужен, чтобы env(safe-area-inset-*) вообще
       возвращал ненулевые значения. Без него max() всегда падал в константу.
       maximum-scale и user-scalable убраны: iOS их игнорирует, а другим
       браузерам они запрещают масштабирование — это провал WCAG 1.4.4. -->
  <!-- interactive-widget=resizes-content: без него экранная клавиатура
       наезжает на поле ввода в чате, потому что фиксированный слой на
       изменение визуального вьюпорта не реагирует. -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta name="theme-color" content="#0B0D10" />
  <meta name="description" content="KAP Connect — профессиональная сеть сотрудников Казатомпрома: кейсы, вопросы и поиск экспертов по всем предприятиям группы." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic,cyrillic-ext,latin,latin-ext"
    rel="stylesheet"
  />
  <title>KAP Connect</title>
</head>
<body>
  <div id="root"></div>
  <noscript>Для работы KAP Connect нужен включённый JavaScript.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
